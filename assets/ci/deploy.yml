name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate topics.csv header
        run: |
          expected='id,category,order,title_si,title_en,theory_url,pastpaper_url,is_new,updated'
          actual=$(head -n 1 data/topics.csv | sed 's/^\xEF\xBB\xBF//' | tr -d '\r')
          if [ "$actual" != "$expected" ]; then
            echo "::error file=data/topics.csv::Header row changed. Expected: $expected"
            exit 1
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js data assets _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
