<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CM Notez – Combined Maths Notes &amp; Past Papers | Vikum Harshana</title>
  <meta name="description" content="All Combined Mathematics (A/L) theory notes and past papers by Vikum Harshana Sir in one place. Pure and Applied Maths topics, Sinhala medium.">
  <meta name="theme-color" content="#17212B" id="meta-theme">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CM Notez">
  <link rel="canonical" href="https://sazindux.github.io/cmnotez/">

  <!-- Open Graph / Twitter -->

  <meta property="og:site_name" content="CM Notez">
  <meta property="og:title" content="CM Notez | VikumHarshana – All Notes">
  <meta property="og:description" content="Combined Mathematics theory notes &amp; past papers – Pure and Applied. ශුද්ධ හා ව්‍යවහාරික ගණිතය.">
  <meta property="og:url" content="https://sazindux.github.io/cmnotez/">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CM Notez | VikumHarshana – All Notes">
  <meta name="twitter:description" content="Combined Mathematics theory notes &amp; past papers – Pure and Applied.">
  <meta name="twitter:image" content="https://sazindux.github.io/cmnotez/assets/icons/og-image.png">

  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- Theme before paint (avoids flash) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cmn:theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.getElementById('meta-theme').setAttribute('content', t === 'light' ? '#FFFFFF' : '#17212B');
      } catch (e) {}
    })();
  </script>

  <!-- Fonts: Inter + Noto Sans Sinhala (non-blocking, display=swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap"></noscript>

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7A9.6 9.6 0 1 0 21.2 15.4a.6.6 0 0 0-.7-.8Z"/></symbol>
      <symbol id="i-tg" viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 4.2 2.9 11.3c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.8ZM9.6 14.2l8.9-5.6c.4-.3.8-.1.5.2l-7.6 6.9-.3 3.2-1.5-4.7Z"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="6.5" rx="2"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="2"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5M8 7.5h8"/></symbol>
      <symbol id="i-paper" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="18.5" r="1.9"/></symbol>
      <symbol id="i-ticks" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 7.5 5 11l7-8.5M9 10.6l.4.4 7-8.5"/></symbol>
      <symbol id="i-tick" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.5 8 11l7-8.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></symbol>
      <symbol id="i-wifi-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 12.8a10 10 0 0 1 4.2-2.4M19 12.8a10 10 0 0 0-2.7-1.9M2 9.2a15 15 0 0 1 4.3-2.6M22 9.2A15 15 0 0 0 11 5.1"/><circle cx="12" cy="20" r=".6" fill="currentColor"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5V15M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
    </defs>
  </svg>

  <a class="skip-link" href="#main">Skip to topics</a>

  <header class="app-header" id="header">
    <div class="shell header-row">
      <a class="brand" href="https://t.me/cmnotez" target="_blank" rel="noopener noreferrer">
        <img class="avatar" src="./assets/logo.svg" width="44" height="44" alt="">
        <div class="brand-text">
          <h1 class="brand-title">CM Notez</h1>
          <p class="brand-sub">Combined Mathematics • Vikum Harshana Sir</p>
        </div>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" role="switch" aria-checked="true" aria-label="Dark mode">
          <span class="tt-track" aria-hidden="true">
            <span class="tt-thumb"></span>
            <svg class="tt-icon tt-sun"><use href="#i-sun"/></svg>
            <svg class="tt-icon tt-moon"><use href="#i-moon"/></svg>
          </span>
        </button>
        <a class="icon-btn join" href="https://t.me/cmnotez" target="_blank" rel="noopener noreferrer" aria-label="Join the CM Notez Telegram channel" title="Join channel">
          <svg aria-hidden="true"><use href="#i-tg"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main id="main" class="shell">
    <section class="controls" aria-label="Browse topics">
      <div class="tabs" role="tablist" aria-label="Category" data-active="pure" id="tabs">
        <span class="tab-indicator" aria-hidden="true"></span>
        <button class="tab" role="tab" id="tab-pure" data-cat="pure" aria-selected="true" aria-controls="panel" type="button">PURE <span class="tab-count" id="count-pure">–</span></button>
        <button class="tab" role="tab" id="tab-applied" data-cat="applied" aria-selected="false" aria-controls="panel" tabindex="-1" type="button">APPLIED <span class="tab-count" id="count-applied">–</span></button>
      </div>

      <div class="toolbar">
        <button class="filter-btn" id="filter-btn" type="button" aria-haspopup="dialog" aria-controls="filter-sheet" aria-label="Filter topics">
          <svg aria-hidden="true"><use href="#i-filter"/></svg>
          <span class="filter-dot" aria-hidden="true"></span>
        </button>
        <div class="search" id="search-wrap" role="search">
          <svg class="search-icon" aria-hidden="true"><use href="#i-search"/></svg>
          <label for="search" class="sr-only">Search topics in Sinhala or English</label>
          <input id="search" type="search" placeholder="Search topics…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
          <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" tabindex="-1">
            <svg aria-hidden="true"><use href="#i-x"/></svg>
          </button>
        </div>
      </div>

      <div class="banner offline" id="offline-banner" role="status" hidden>
        <svg aria-hidden="true"><use href="#i-wifi-off"/></svg>
        <span class="banner-text">Offline – showing saved notes</span>
      </div>
      <div class="banner" id="install-banner" hidden>
        <svg aria-hidden="true"><use href="#i-download"/></svg>
        <span class="banner-text">Install CM Notez for quick access</span>
        <button class="btn-mini" id="install-btn" type="button">Install</button>
        <button class="icon-btn" id="install-close" type="button" aria-label="Dismiss install prompt"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>

      <div class="meta-row">
        <p class="result-count" id="result-count" aria-live="polite">Loading topics…</p>
        <div class="view-toggle" role="group" aria-label="Layout">
          <button class="view-btn" type="button" data-view="list" aria-pressed="true" aria-label="List view"><svg aria-hidden="true"><use href="#i-list"/></svg></button>
          <button class="view-btn" type="button" data-view="grid" aria-pressed="false" aria-label="Grid view"><svg aria-hidden="true"><use href="#i-grid"/></svg></button>
        </div>
      </div>
    </section>

    <section class="panel" id="panel" role="tabpanel" aria-labelledby="tab-pure">
      <ul class="list" id="list" data-view="list" aria-busy="true">
        <li class="card skeleton" aria-hidden="true"><div class="card-head"><span class="sk sk-num"></span><div class="titles"><div class="sk sk-line w70"></div><div class="sk sk-line w45"></div></div></div><div class="actions"><span class="sk sk-btn"></span><span class="sk sk-btn"></span></div></li>
        <li class="card skeleton" aria-hidden="true"><div class="card-head"><span class="sk sk-num"></span><div class="titles"><div class="sk sk-line w70"></div><div class="sk sk-line w45"></div></div></div><div class="actions"><span class="sk sk-btn"></span><span class="sk sk-btn"></span></div></li>
        <li class="card skeleton" aria-hidden="true"><div class="card-head"><span class="sk sk-num"></span><div class="titles"><div class="sk sk-line w70"></div><div class="sk sk-line w45"></div></div></div><div class="actions"><span class="sk sk-btn"></span><span class="sk sk-btn"></span></div></li>
        <li class="card skeleton" aria-hidden="true"><div class="card-head"><span class="sk sk-num"></span><div class="titles"><div class="sk sk-line w70"></div><div class="sk sk-line w45"></div></div></div><div class="actions"><span class="sk sk-btn"></span><span class="sk sk-btn"></span></div></li>
        <li class="card skeleton" aria-hidden="true"><div class="card-head"><span class="sk sk-num"></span><div class="titles"><div class="sk sk-line w70"></div><div class="sk sk-line w45"></div></div></div><div class="actions"><span class="sk sk-btn"></span><span class="sk sk-btn"></span></div></li>
        <li class="card skeleton" aria-hidden="true"><div class="card-head"><span class="sk sk-num"></span><div class="titles"><div class="sk sk-line w70"></div><div class="sk sk-line w45"></div></div></div><div class="actions"><span class="sk sk-btn"></span><span class="sk sk-btn"></span></div></li>
      </ul>
    </section>
  </main>

  <footer class="app-footer shell">
    <p>Made for A/L Combined Mathematics students 🇱🇰</p>
    <p><a href="https://t.me/cmnotez" target="_blank" rel="noopener noreferrer">t.me/cmnotez · CM Notez | VikumHarshana</a></p>
    <p id="last-updated"></p>
  </footer>

  <button class="fab" id="fab" type="button" aria-label="Scroll to top" tabindex="-1">
    <svg aria-hidden="true"><use href="#i-up"/></svg>
  </button>

  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <div class="sheet" id="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="filter-title" aria-hidden="true">
    <button class="sheet-handle" type="button" aria-label="Close filters" data-close></button>
    <h2 class="sheet-title" id="filter-title">Filter topics</h2>
    <p class="sheet-sub">Show topics by available resources</p>
    <div class="chips" role="radiogroup" aria-label="Filter" id="chips">
      <button class="chip" type="button" role="radio" data-filter="all" aria-checked="true"><svg aria-hidden="true"><use href="#i-check"/></svg>All</button>
      <button class="chip" type="button" role="radio" data-filter="theory" aria-checked="false"><svg aria-hidden="true"><use href="#i-check"/></svg>Has Theory Note</button>
      <button class="chip" type="button" role="radio" data-filter="paper" aria-checked="false"><svg aria-hidden="true"><use href="#i-check"/></svg>Has Past Papers</button>
      <button class="chip" type="button" role="radio" data-filter="both" aria-checked="false"><svg aria-hidden="true"><use href="#i-check"/></svg>Has Both</button>
      <button class="chip" type="button" role="radio" data-filter="new" aria-checked="false"><svg aria-hidden="true"><use href="#i-check"/></svg>New</button>
      <button class="chip" type="button" role="radio" data-filter="soon" aria-checked="false"><svg aria-hidden="true"><use href="#i-check"/></svg>Coming soon</button>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" type="button" id="filter-reset">Reset</button>
      <button class="btn btn-primary" type="button" data-close>Show results</button>
    </div>
  </div>

  <div class="sheet" id="action-sheet" role="dialog" aria-modal="true" aria-labelledby="action-title" aria-hidden="true">
    <button class="sheet-handle" type="button" aria-label="Close menu" data-close></button>
    <h2 class="sheet-title" id="action-title"></h2>
    <p class="sheet-sub" id="action-sub"></p>
    <ul class="action-list">
      <li><button class="action-item" type="button" data-act="copy-theory"><svg aria-hidden="true"><use href="#i-link"/></svg>Copy link (Theory)<small></small></button></li>
      <li><button class="action-item" type="button" data-act="copy-paper"><svg aria-hidden="true"><use href="#i-link"/></svg>Copy link (Past Papers)<small></small></button></li>
      <li><button class="action-item" type="button" data-act="share"><svg aria-hidden="true"><use href="#i-share"/></svg>Share topic</button></li>
    </ul>
  </div>

  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
